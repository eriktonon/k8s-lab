---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btm-reference-service
  namespace: workloads
  labels:
    app.kubernetes.io/name: btm-reference-service
    app.kubernetes.io/part-of: k8s-lab-platform
    btm.ibm.com/tier: application
    btm.ibm.com/slo-tier: gold
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: btm-reference-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: btm-reference-service
        btm.ibm.com/exposure: internal-http
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: btm-reference-service
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "-listen=:8080"
            - "-text={\"service\":\"btm-reference-service\",\"status\":\"healthy\",\"platform\":\"k8s-lab-v1.31\"}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: btm-reference-service
  namespace: workloads
  labels:
    app.kubernetes.io/name: btm-reference-service
    app.kubernetes.io/part-of: k8s-lab-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: btm-reference-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: btm-reference-service-pdb
  namespace: workloads
  labels:
    app.kubernetes.io/name: btm-reference-service
    app.kubernetes.io/part-of: k8s-lab-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: btm-reference-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: btm-reference-service-hpa
  namespace: workloads
  labels:
    app.kubernetes.io/name: btm-reference-service
    app.kubernetes.io/part-of: k8s-lab-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: btm-reference-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
