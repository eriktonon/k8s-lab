---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workloads-compute-quota
  namespace: workloads
  labels:
    app.kubernetes.io/part-of: k8s-lab-platform
    btm.ibm.com/control: finops-capacity
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workloads-default-limits
  namespace: workloads
  labels:
    app.kubernetes.io/part-of: k8s-lab-platform
    btm.ibm.com/control: resource-hygiene
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 10m
        memory: 16Mi
