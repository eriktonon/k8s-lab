---
# Declarative Multi-Node Kubernetes Cluster Topology
# Default Base Image: Ubuntu 24.04 LTS (Noble Numbat)
# Private Cluster Network: 192.168.99.0/24

- name: master
  role: control_plane
  box: bento/ubuntu-24.04
  hostname: master.k8s.corp.br
  ipaddress: 192.168.99.100
  memory: 4096
  cpus: 2
  provision: provision/ansible/master.yaml

- name: node1
  role: worker
  box: bento/ubuntu-24.04
  hostname: node1.k8s.corp.br
  ipaddress: 192.168.99.101
  memory: 2048
  cpus: 2
  provision: provision/ansible/nodes.yaml

- name: node2
  role: worker
  box: bento/ubuntu-24.04
  hostname: node2.k8s.corp.br
  ipaddress: 192.168.99.102
  memory: 2048
  cpus: 2
  provision: provision/ansible/nodes.yaml
